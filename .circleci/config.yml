version: 2.1

orbs:
  node: circleci/node@5.1.0

node-image: &node-image
  image: cimg/node:26.8.1
  auth:
    username: $DOCKERHUB_USERNAME
    password: $DOCKERHUB_ACCESS_TOKEN

only-run-on-release-branches: &only-run-on-release-branches
  branches:
    only:
      - main
      - alpha
      - next-major

workflows:
  version: 2
  workflow:
    jobs:
      - build:
          context:
            - npm-readonly
            - github
            - dockerhub
      - validate-code:
          context:
            - npm-readonly
            - dockerhub
      - publish:
          context:
            - npm-trusted-publish
            - npm-readonly
            - github
            - dockerhub
          requires:
            - build
          filters:
            <<: *only-run-on-release-branches
      - chromatic:
          context:
            - npm-readonly
            - github
            - dockerhub
          requires:
            - build

commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Login in NPM
          command: 'echo "npmAuthToken: $NPM_TOKEN" >> ${HOME}/.yarnrc.yml'
      - node/install-packages:
          pkg-manager: yarn-berry
          include-branch-in-cache-key: false

jobs:
  build:
    resource_class: "xlarge"
    docker:
      - <<: *node-image
    steps:
      - bootstrap
      - run:
          name: Validate design tokens (tokens.json)
          command: yarn validate:tokens
      - run:
          name: Check design token generated files match tokens
          command: yarn check:token-drift
      - run: yarn build
      - run: yarn type-check
      - run: yarn test

  validate-code:
    docker:
      - <<: *node-image
    steps:
      - bootstrap
      - run:
          name: Run oxlint
          command: yarn lint:ci

  publish:
    resource_class: "xlarge"
    docker:
      - <<: *node-image
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
          include-branch-in-cache-key: false
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
            yarn semantic-release

  chromatic:
    resource_class: "xlarge"
    parameters:
      flags:
        type: string
        default: ""
    docker:
      - <<: *node-image
    working_directory: ~/project
    steps:
      # Off main, only run for open, non-draft pull requests. CircleCI has no native "draft PR" signal, so ask GitHub.
      # A branch with no open PR is skipped. If the draft lookup itself fails, Chromatic still runs.
      - when:
          condition:
            not:
              equal: [main, <<pipeline.git.branch>>]
          steps:
            - run:
                name: Skip Chromatic for draft pull requests and branches without a PR
                command: |
                  if [ -z "$CIRCLE_PULL_REQUEST" ]; then
                    echo "No open pull request for this branch, skipping Chromatic"
                    circleci-agent step halt
                    exit 0
                  fi
                  draft=$(curl -fsS ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} \
                    "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls/${CIRCLE_PULL_REQUEST##*/}" \
                    | jq -r .draft) || draft=""
                  if [ "$draft" = "true" ]; then
                    echo "Draft pull request, skipping Chromatic"
                    circleci-agent step halt
                    exit 0
                  fi
      - bootstrap
      - when:
          condition:
            equal: [main, <<pipeline.git.branch>>]
          steps:
            - run: yarn chromatic --auto-accept-changes
      - when:
          condition:
            not:
              equal: [main, <<pipeline.git.branch>>]
          steps:
            - run: yarn chromatic
