version: 2.1

orbs:
  node: circleci/node@5.1.0

node-image: &node-image
  image: cimg/node:26.8.1
  auth:
    username: $DOCKERHUB_USERNAME
    password: $DOCKERHUB_ACCESS_TOKEN

only-run-on-release-branches: &only-run-on-release-branches
  branches:
    only:
      - main
      - alpha
      - next-major

workflows:
  version: 2
  workflow:
    jobs:
      - build:
          context:
            - npm-readonly
            - github
            - dockerhub
      - validate-code:
          context:
            - npm-readonly
            - dockerhub
      - publish:
          context:
            - npm-publish
            - github
            - dockerhub
          requires:
            - build
          filters:
            <<: *only-run-on-release-branches
      - chromatic:
          context:
            - npm-readonly
            - dockerhub

commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Login in NPM
          command: 'echo "npmAuthToken: $NPM_TOKEN" >> ${HOME}/.yarnrc.yml'
      - node/install-packages:
          pkg-manager: yarn-berry
          include-branch-in-cache-key: false

jobs:
  build:
    resource_class: "xlarge"
    docker:
      - <<: *node-image
    steps:
      - bootstrap
      - run:
          name: Validate design tokens (tokens.json)
          command: yarn validate:tokens
      - run:
          name: Check design token generated files match tokens
          command: yarn check:token-drift
      - run: yarn build
      - run: yarn type-check
      - run: yarn test

  validate-code:
    docker:
      - <<: *node-image
    steps:
      - bootstrap
      - run:
          name: Run oxlint
          command: yarn lint:ci

  publish:
    resource_class: "xlarge"
    docker:
      - <<: *node-image
    steps:
      - bootstrap
      - run: yarn semantic-release

  chromatic:
    resource_class: "xlarge"
    parameters:
      flags:
        type: string
        default: ""
    docker:
      - <<: *node-image
    working_directory: ~/project
    steps:
      - bootstrap
      - when:
          condition:
            equal: [main, <<pipeline.git.branch>>]
          steps:
            - run: yarn chromatic --auto-accept-changes
      - when:
          condition:
            not:
              equal: [main, <<pipeline.git.branch>>]
          steps:
            - run: yarn chromatic
